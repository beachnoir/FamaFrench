# See docs at: https://mystmd.org/guide/frontmatter
version: 1

project:
  title: "Empirical Asset Pricing: From Statistics to Factor ETFs"
  github: https://github.com/beachnoir/FamaFrench

  # Enable launch buttons (Binder) and in-page live code execution
  # Uses mybinder.org with this repo's requirements.txt for the environment
  jupyter: true

  # Render committed outputs; refresh and execute with scripts/run_notebooks.py before building
  # Execution is opt-in via --execute; the build command omits that flag.
  bibliography:
    - references.bib

  toc:
    - file: index.md
    - title: Statistical foundations
      children:
        - file: 01_Statistical_Foundations.ipynb
        - file: 02_Time_Series_Foundations.ipynb
    - title: Empirical asset-pricing models
      children:
        - file: 03_Fama_French_3Factor.ipynb
        - file: 04_Advanced_Factor_Models.ipynb
    - title: Research in practice
      children:
        - file: 05_Practical_Factor_Investing.ipynb
    - title: Reference
      children:
        - file: 06_Solution_Manual.ipynb
        - file: data-and-methods.md

  exclude:
    - README.md
    - DEVELOPMENT.md
    - .local/**
    - venv/**
    - _build/**
    - .github/**
    - data/**
    - reports/**
    - scripts/**
    - tests/**

site:
  template: book-theme
  options:
    logo_text: Empirical Asset Pricing
    base_url: /FamaFrench
    style: custom.css
