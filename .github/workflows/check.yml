name: Validate analysis code
on:
  push:
    branches-ignore: [main]  # Main is validated by the deployment workflow.
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Validate saved notebooks
        run: python scripts/check_notebooks.py
